# clamd configuration for Lock (roadmap 2.2, follow-up F3).
# Mounted into the clamav container by docker-compose.yml. Production deployments must use the same
# limits, or large videos stay PENDING_SCAN forever (alert on the lock.scan.pending gauge).

TCPSocket 3310
TCPAddr 0.0.0.0
Foreground yes
LogTime yes
LogFile /dev/stdout

DatabaseDirectory /var/lib/clamav

# The largest upload Lock accepts is a 2 GB video (lock.storage.max-video-bytes). clamd refuses
# streams over StreamMaxLength with an error, which Lock treats as "retry", never as clean.
StreamMaxLength 2100M
# Scan limits must cover the whole file too, or clamd stops early and reports it as clean.
MaxScanSize 2100M
MaxFileSize 2100M
# Large files take a while; Lock's own timeout is lock.scan.timeout (PT2M by default).
ReadTimeout 300
CommandReadTimeout 300
StreamMaxPort 2048
MaxThreads 8
