spring:
  application:
    name: lock
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${LOCK_DB_URL:jdbc:postgresql://localhost:5432/lock}
    username: ${LOCK_DB_USER:lock}
    password: ${LOCK_DB_PASSWORD:lock}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${PORT:8080}
  # Rate limits key on the client IP. Behind a load balancer set this to "framework" so the IP comes
  # from X-Forwarded-For. Leave it "none" otherwise, or clients could spoof the header to dodge limits.
  forward-headers-strategy: ${LOCK_FORWARD_HEADERS:none}

management:
  endpoints:
    web:
      exposure:
        # health and info are public. metrics and prometheus are refused on the app port
        # (SecurityConfig); set LOCK_MANAGEMENT_PORT to serve actuator on a private port for scraping.
        include: health,info,metrics,prometheus
  server:
    port: ${LOCK_MANAGEMENT_PORT:}
  endpoint:
    health:
      probes:
        enabled: true            # /actuator/health/liveness and /actuator/health/readiness
      group:
        readiness:
          include: readinessState,db,storage
      show-details: never        # never leak DB/storage error details to anonymous callers
  metrics:
    tags:
      application: lock

logging:
  pattern:
    # Every line carries the request id set by RequestIdFilter.
    correlation: "[%X{requestId:-}] "
  structured:
    format:
      # Set LOCK_LOG_FORMAT=ecs (or logstash) in production for one JSON object per line.
      console: ${LOCK_LOG_FORMAT:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

lock:
  scheduling-enabled: true
  # Browser origins allowed to call the API (the Expo web client in dev). Native apps don't need CORS.
  cors-allowed-origins: ${LOCK_CORS_ORIGINS:http://localhost:8081,http://localhost:19006}
  jwt:
    # Dev-only default. Production must set LOCK_JWT_SECRET (>= 32 bytes, base64).
    secret: ${LOCK_JWT_SECRET:ZGV2LW9ubHktand0LXNlY3JldC1jaGFuZ2UtbWUtcGxlYXNlLTEyMzQ1Ng==}
    issuer: lock
    ttl: PT15M          # access token; clients renew it with the refresh token
    refresh-ttl: P30D   # sliding: every refresh issues a new token valid this long
  crypto:
    # local: KEK is master-key below. aws-kms: KEK never leaves AWS KMS (recommended for production).
    provider: ${LOCK_CRYPTO_PROVIDER:local}
    # Dev-only key-encryption key (base64, 32 bytes). Production: set LOCK_MASTER_KEY, or use aws-kms.
    master-key: ${LOCK_MASTER_KEY:U41EknbduMk8SqoWrNBc3ZvWCZ2xTS/5+K8C9tmG4Sw=}
    # Old local keys, comma-separated, used only to unwrap until the re-wrap job has moved every vault.
    retired-master-keys: ${LOCK_RETIRED_MASTER_KEYS:}
    kms-key-id: ${LOCK_KMS_KEY_ID:}          # key ARN or alias/..., required for aws-kms
    kms-region: ${LOCK_KMS_REGION:${LOCK_S3_REGION:us-east-1}}
    kms-endpoint: ${LOCK_KMS_ENDPOINT:}      # only for LocalStack-style testing
  rate-limit:
    auth-requests-per-minute: 20   # per client IP, per /auth endpoint
    max-failed-logins: 5           # wrong passwords per account before a temporary lockout
    lockout: PT15M
  scan:
    # clamav: a clamd sidecar (production). dev: recognises only the EICAR test file (refused in prod).
    provider: ${LOCK_SCAN_PROVIDER:dev}
    clamav-host: ${LOCK_CLAMAV_HOST:localhost}
    clamav-port: ${LOCK_CLAMAV_PORT:3310}
    timeout: PT2M
  export:
    ttl: P7D             # ZIP exports are deleted from storage after this
  account:
    deletion-grace-period: P30D
  email:
    # log: nothing is sent (dev). postmark: sends via Postmark (set LOCK_POSTMARK_TOKEN).
    provider: ${LOCK_EMAIL_PROVIDER:log}
    from: ${LOCK_EMAIL_FROM:Lock <no-reply@lock.app>}
    # Client page that takes ?token=. The Expo app handles lock://reset-password as well.
    reset-url: ${LOCK_RESET_URL:http://localhost:8081/reset-password}
    reset-ttl: PT30M
    postmark-token: ${LOCK_POSTMARK_TOKEN:}
    log-body: false      # the body holds reset links: only log it in local dev
  push:
    # log: nothing is sent (dev). expo: Expo push service (LOCK_EXPO_ACCESS_TOKEN if enhanced security is on).
    provider: ${LOCK_PUSH_PROVIDER:log}
    expo-access-token: ${LOCK_EXPO_ACCESS_TOKEN:}
  transcode:
    # none: videos/audio play as uploaded and HEIC/WebP get no thumbnail. ffmpeg: renditions + decoding.
    provider: ${LOCK_TRANSCODE_PROVIDER:none}
    ffmpeg-path: ${LOCK_FFMPEG_PATH:ffmpeg}
    timeout: PT30M
  quota:
    default-plan: ${LOCK_DEFAULT_PLAN:free}
    plans:               # bytes of original media a user may upload, across all vaults
      free: 5GB
      plus: 200GB
      premium: 2TB
  cold-tier:
    # Tag originals of memories locked longer than "after" with lock-tier=cold. A bucket lifecycle rule
    # on that tag moves them to an instant-retrieval class (GLACIER_IR), so Relive never waits on a
    # restore. See docs/decisions.md §20 for the rule.
    enabled: ${LOCK_COLD_TIER_ENABLED:false}
    after: P365D
  memory:
    cooling-off: ${LOCK_COOLING_OFF:PT24H}
    deletion-grace-period: P30D
    upload-expiry: PT24H
  storage:
    type: ${LOCK_STORAGE_TYPE:s3}
    bucket: ${LOCK_S3_BUCKET:lock-media}
    endpoint: ${LOCK_S3_ENDPOINT:http://localhost:9000}
    region: ${LOCK_S3_REGION:us-east-1}
    access-key: ${LOCK_S3_ACCESS_KEY:lock}
    secret-key: ${LOCK_S3_SECRET_KEY:lock-secret}
    path-style: true
    presign-ttl: PT15M
    max-photo-bytes: 52428800      # 50 MB
    max-video-bytes: 2147483648    # 2 GB
    max-audio-bytes: 209715200     # 200 MB
    # S3 Object Lock (GOVERNANCE mode) applied to assets once a memory locks. 0 disables.
    # Requires a bucket created with object lock enabled. Governance (not compliance) mode keeps an
    # administrative removal path for legal erasure and illegal content (feasibility analysis §3).
    object-lock-years: ${LOCK_OBJECT_LOCK_YEARS:0}
